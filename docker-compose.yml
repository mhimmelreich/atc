# filepath: docker-compose.yml
services:
  atc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atc
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.atc.loadbalancer.server.port=80"
      # Spiel unter games.himmelreich.cloud/atc
      - "traefik.http.routers.atc.rule=Host(`games.himmelreich.cloud`) && PathPrefix(`/atc`)"
      - "traefik.http.routers.atc.entrypoints=web"
      - "traefik.http.routers.atc.service=atc"
      - "traefik.http.routers.atc.middlewares=atc-strip"
      - "traefik.http.middlewares.atc-strip.stripprefix.prefixes=/atc"
      # Alte Adresse atc.himmelreich.cloud leitet weiter
      - "traefik.http.routers.atc-old.rule=Host(`atc.himmelreich.cloud`)"
      - "traefik.http.routers.atc-old.entrypoints=web"
      - "traefik.http.routers.atc-old.service=atc"
      - "traefik.http.routers.atc-old.middlewares=atc-moved"
      - "traefik.http.middlewares.atc-moved.redirectregex.regex=^https?://atc\\.himmelreich\\.cloud/?(.*)"
      - "traefik.http.middlewares.atc-moved.redirectregex.replacement=https://games.himmelreich.cloud/atc/$${1}"
    depends_on:
      - atc-api

  atc-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: atc-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      TZ: Europe/Berlin
      NAVDATA_DB: /app/data/navdata/little_navmap_navigraph.sqlite
      # Privater Schlüssel für /api/navdata (in .env setzen, nicht committen)
      NAVDATA_KEY: ${NAVDATA_KEY:-}
      TTS_URL: http://atc-tts:5002
    volumes:
      # Navigraph-AIRAC-DB (lizenziert, nicht im Repo) – siehe scripts/extract-navdata.sh
      - ./data/navdata:/app/data/navdata:ro
      # OurAirports-CSVs (frei, vom Server geladen und gecacht)
      - ./data/opendata:/app/data/opendata
      # Ortschaften aus OpenStreetMap (Overpass, gecacht)
      - ./data/towns:/app/data/towns
      # Markante Bauwerke aus OpenStreetMap (Overpass, gecacht)
      - ./data/landmarks:/app/data/landmarks
      # Nordatlantik-Tracks (FAA, frei), gesammelt für die Lücke über dem Ozean
      - ./data/nat:/app/data/nat
      # Tagesaufzeichnung der Starts und Landungen (WATCH TAG), 30 Tage
      - ./data/daytracks:/app/data/daytracks
      # Flughafengelände aus OpenStreetMap (Terminals, Vorfeld, Tower …, Overpass, gecacht)
      - ./data/airport:/app/data/airport
      # Autobahnen aus OpenStreetMap (Overpass, gecacht)
      - ./data/roads:/app/data/roads
    networks:
      - proxy
    depends_on:
      - atc-tts

  # Sprachausgabe für den Funkverkehr (Piper), nur intern über atc-api erreichbar
  atc-tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    container_name: atc-tts
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
    networks:
      - proxy

networks:
  proxy:
    external: true
